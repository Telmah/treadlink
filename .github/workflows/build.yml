name: Build

on:
  push:
    branches: [main, diagnostic-rsc-v1.1.1-gap-lifecycle, diag-longrun-ble-capture]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware
        run: pio run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/seeed_xiao_esp32s3/firmware.bin
            .pio/build/seeed_xiao_esp32s3/bootloader.bin
            .pio/build/seeed_xiao_esp32s3/partitions.bin
