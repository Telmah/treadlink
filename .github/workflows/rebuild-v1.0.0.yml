name: Rebuild v1.0.0 (ESP-IDF 5.5.3)

on:
  push:
    branches:
      - rebuild-v1.0.0-idf553
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.0.0 source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Show build environment
        run: |
          python --version
          pio --version
          pio system info
          pio pkg list

      - name: Build firmware
        run: pio run -v

      - name: Save build metadata
        if: always()
        run: |
          mkdir -p build-info
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Python:"
            python --version
            echo "PlatformIO:"
            pio --version
            echo "Installed packages:"
            pio pkg list
            echo "Platform manifest:"
            cat "$HOME/.platformio/platforms/espressif32/platform.json" 2>/dev/null || true
          } > build-info/build-environment.txt
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin build-info/ 2>/dev/null || true
          cp .pio/build/seeed_xiao_esp32s3/bootloader.bin build-info/ 2>/dev/null || true
          cp .pio/build/seeed_xiao_esp32s3/partitions.bin build-info/ 2>/dev/null || true

      - name: Upload firmware and build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treadlink-v1.0.0-idf553-${{ github.run_number }}
          path: build-info/
          if-no-files-found: warn
          retention-days: 30
